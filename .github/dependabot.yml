version: 2
updates:
  - package-ecosystem: "bundler"
    directory: "/"
    schedule:
      interval: "monthly"
    allow:
      # Update transitive dependencies too.
      - dependency-type: "all"
    ignore:
      - dependency-name: "puma"
      - dependency-name: "rack"
    groups:
      ruby-dependencies:
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
